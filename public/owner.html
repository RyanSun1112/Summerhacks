<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pulse — Venue owner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ground:#080A18; --accent:#3B4FE0; --accent2:#7B3FD4;
    --ink:#F0EFF7; --muted:#7E7D99; --ok:#3ECF8E; --warn:#F0A93B; --bad:#E85D5D;
    --rule:rgba(240,239,247,.10); --glass:rgba(12,15,34,.72);
    --sans:'Space Grotesk',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    min-height:100dvh;background:var(--ground);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;font-size:15px;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 70% 50% at 50% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
  }
  .lab{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  header{
    position:relative;z-index:2;display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;
    padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));border-bottom:1px solid var(--rule);
  }
  .mark b{font-size:15px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
  .mark span{font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:.05em}
  header a{
    margin-left:auto;color:var(--muted);font-size:12px;text-decoration:none;letter-spacing:.08em;text-transform:uppercase;
    min-height:44px;display:inline-flex;align-items:center;padding:8px 4px;
  }
  header a:hover,header a:active{color:var(--ink)}
  main{position:relative;z-index:1;flex:1;display:flex;justify-content:center;padding:28px 14px 48px}
  .card{
    width:100%;max-width:440px;background:var(--glass);border:1px solid var(--rule);
    border-radius:10px;padding:24px 18px 20px;backdrop-filter:blur(18px);
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .card.wide{max-width:560px}
  h1{font-size:clamp(20px,5.5vw,22px);font-weight:600;margin:6px 0 8px}
  .sub{font-size:14px;color:var(--muted);line-height:1.45;margin-bottom:22px}
  label{display:block;margin:14px 0 6px}
  input{
    width:100%;background:rgba(8,10,24,.65);border:1px solid var(--rule);border-radius:6px;
    color:var(--ink);font-family:var(--mono);font-size:16px;padding:12px 12px;min-height:48px;
  }
  input:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  button{
    font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    border:0;border-radius:6px;padding:12px 16px;cursor:pointer;min-height:44px;
  }
  .primary{background:var(--accent);color:#080A18;flex:1}
  .primary:hover,.primary:active{filter:brightness(1.08)}
  .ghost{background:none;border:1px solid var(--rule);color:var(--muted);flex:1}
  .ghost:hover,.ghost:active{color:var(--ink);border-color:var(--accent)}
  .msg{margin-top:14px;font-family:var(--mono);font-size:13px;line-height:1.4;min-height:1.2em}
  .msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
  .hidden{display:none!important}
  .who{font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:18px;word-break:break-word}
  .who b{color:var(--ink);font-weight:500}
  .actions{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .vlist{display:flex;flex-direction:column;gap:8px}
  .vrow{
    display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 14px;border:1px solid var(--rule);
    border-radius:7px;background:rgba(8,10,24,.4);
  }
  .vrow .vn{font-size:15px;font-weight:600;flex:1;min-width:120px}
  .vrow .meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .live{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);padding:4px 8px;border-radius:3px}
  .vrow button{padding:10px 12px;background:none;border:1px solid var(--rule);color:var(--ink);min-height:44px}
  .vrow button:hover,.vrow button:active{border-color:var(--accent)}
  .vrow button.danger{color:var(--bad)}
  .empty{font-size:14px;color:var(--muted);padding:18px 0}
  @media (max-width:420px){
    .mark span{display:none}
    header a{margin-left:0}
    .actions .primary,.actions .ghost,.row .primary,.row .ghost{flex:1 1 100%}
  }
</style>
</head>
<body>
<header>
  <div class="mark"><b>Pulse</b><span>Venue owner</span></div>
  <a href="/dashboard.html">Public dashboard</a>
</header>

<main>
  <!-- Auth -->
  <section id="authCard" class="card">
    <div class="lab">Account</div>
    <h1>Sign in to manage venues</h1>
    <p class="sub">Attendees still check in anonymously via QR. This login is only for venue owners.</p>
    <label class="lab" for="email">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
    <label class="lab" for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="row">
      <button class="primary" id="btnLogin" type="button">Log in</button>
      <button class="ghost" id="btnSignup" type="button">Sign up</button>
    </div>
    <div class="msg" id="authMsg"></div>
  </section>

  <!-- Dashboard -->
  <section id="dashCard" class="card wide hidden">
    <div class="lab">Your venues</div>
    <h1>Owner dashboard</h1>
    <p class="who">Signed in as <b id="who"></b></p>
    <div class="actions">
      <button class="primary" id="btnNew" type="button">Create new venue</button>
      <button class="ghost" id="btnLogout" type="button">Log out</button>
    </div>
    <div id="venueList" class="vlist"></div>
    <div class="msg" id="dashMsg"></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
let sb = null;
let accessToken = null;

function setMsg(el, text, kind) {
  el.textContent = text || '';
  el.className = 'msg' + (kind ? ' ' + kind : '');
}

async function authHeaders() {
  const h = { 'content-type': 'application/json' };
  if (accessToken) h.Authorization = 'Bearer ' + accessToken;
  return h;
}

async function init() {
  const cfgRes = await fetch('/auth/config');
  const cfg = await cfgRes.json().catch(() => ({}));
  if (!cfgRes.ok || !cfg.url) {
    setMsg($('#authMsg'),
      cfg.error === 'auth not configured'
        ? 'Server auth is off. Add SUPABASE_URL / ANON_KEY / SERVICE_ROLE_KEY to .env and restart.'
        : (cfg.error || 'Could not load auth config.'),
      'err');
    return;
  }
  sb = supabase.createClient(cfg.url, cfg.anonKey);
  sb.auth.onAuthStateChange((_event, session) => {
    accessToken = session ? session.access_token : null;
  });
  const { data: { session } } = await sb.auth.getSession();
  accessToken = session ? session.access_token : null;
  if (session) showDash(session);
}

async function showDash(session) {
  $('#authCard').classList.add('hidden');
  $('#dashCard').classList.remove('hidden');
  $('#who').textContent = session.user.email || session.user.id;
  await loadMyVenues();
}

function showAuth() {
  $('#dashCard').classList.add('hidden');
  $('#authCard').classList.remove('hidden');
  $('#venueList').innerHTML = '';
}

async function loadMyVenues() {
  const res = await fetch('/api/me/venues', { headers: await authHeaders() });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    setMsg($('#dashMsg'), body.error || 'Failed to load venues', 'err');
    if (res.status === 401) showAuth();
    return;
  }
  setMsg($('#dashMsg'), '');
  const list = body.venues || [];
  if (!list.length) {
    $('#venueList').innerHTML = '<div class="empty">No venues yet. Create one to open the editor.</div>';
    return;
  }
  $('#venueList').innerHTML = list.map(v => `
    <div class="vrow" data-id="${esc(v.id)}">
      <div>
        <div class="vn">${esc(v.name || v.id)}${v.active ? ' <span class="live">LIVE</span>' : ''}</div>
        <div class="meta">${v.missing ? 'file missing on server' : (v.zones + ' zones')}${v.calibrated ? ' · calibrated' : ''}</div>
      </div>
      <button type="button" data-act="edit">Edit</button>
      <button type="button" class="danger" data-act="del" ${v.active ? 'disabled title="Activate another venue first"' : ''}>Delete</button>
    </div>`).join('');
  $('#venueList').querySelectorAll('.vrow').forEach(row => {
    row.querySelector('[data-act="edit"]').addEventListener('click', () => {
      location.href = '/dashboard.html?edit=' + encodeURIComponent(row.dataset.id);
    });
    const del = row.querySelector('[data-act="del"]');
    if (del && !del.disabled) del.addEventListener('click', () => deleteVenue(row.dataset.id, row));
  });
}

async function deleteVenue(id, row) {
  if (!confirm('Delete venue "' + id + '"? This cannot be undone.')) return;
  const res = await fetch('/venues/' + encodeURIComponent(id), {
    method: 'DELETE', headers: await authHeaders()
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    setMsg($('#dashMsg'), body.error || 'Delete failed', 'err');
    return;
  }
  setMsg($('#dashMsg'), 'Deleted ' + id, 'ok');
  row.remove();
  if (!$('#venueList').children.length) loadMyVenues();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

$('#btnLogin').addEventListener('click', async () => {
  setMsg($('#authMsg'), 'Signing in…');
  const email = $('#email').value.trim();
  const password = $('#password').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    console.warn('[owner] login fail', error.message);
    setMsg($('#authMsg'), error.message, 'err');
    return;
  }
  console.log('[owner] login ok', data.user && data.user.id);
  accessToken = data.session.access_token;
  setMsg($('#authMsg'), 'Signed in.', 'ok');
  showDash(data.session);
});

$('#btnSignup').addEventListener('click', async () => {
  setMsg($('#authMsg'), 'Creating account…');
  const email = $('#email').value.trim();
  const password = $('#password').value;
  if (password.length < 6) {
    setMsg($('#authMsg'), 'Password must be at least 6 characters.', 'err');
    return;
  }
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) {
    console.warn('[owner] signup fail', error.message);
    setMsg($('#authMsg'), error.message, 'err');
    return;
  }
  // With "Confirm email" off, session is present immediately.
  if (data.session) {
    console.log('[owner] signup ok', data.user && data.user.id);
    accessToken = data.session.access_token;
    setMsg($('#authMsg'), 'Account created.', 'ok');
    showDash(data.session);
  } else {
    setMsg($('#authMsg'),
      'Account created — check email to confirm, or disable Confirm email in Supabase Auth settings.',
      'ok');
  }
});

$('#btnLogout').addEventListener('click', async () => {
  await sb.auth.signOut();
  accessToken = null;
  showAuth();
  setMsg($('#authMsg'), 'Signed out.', 'ok');
});

$('#btnNew').addEventListener('click', () => {
  location.href = '/dashboard.html?edit=new';
});

init().catch(e => {
  console.error('[owner] init', e);
  setMsg($('#authMsg'), e.message || 'Init failed', 'err');
});
</script>
</body>
</html>
